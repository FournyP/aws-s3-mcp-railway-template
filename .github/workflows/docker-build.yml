# Builds both images this template ships (gateway and mcp) on every PR and on
# main, boots the mcp server against a local S3 gateway, and exercises the
# gateway's runtime-rendered nginx config.
name: docker-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, mcp]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # A successful image build says nothing about the server starting on the
  # pinned Node version, so this job boots the real mcp image against a local
  # S3 gateway and drives it over MCP: list the bucket, read a text object, and
  # read a PDF, which goes through pdf-parse.
  mcp-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build mcp image locally
        uses: docker/build-push-action@v7
        with:
          context: mcp
          push: false
          load: true
          tags: mcp:ci
          cache-from: type=gha,scope=mcp

      - name: Start an S3 gateway with objects in it
        run: |
          set -eu
          docker network create ci-net
          docker run -d --name s3gw --network ci-net \
            -e ROOT_ACCESS_KEY=ciaccesskey \
            -e ROOT_SECRET_KEY=cisecretkey \
            -p 9000:9000 \
            versity/versitygw:v1.8.0 --port :9000 posix /tmp/vgw
          # Any HTTP answer means it is up; anonymous requests get a 403.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && break
            sleep 1
          done

          printf 'hello from the bucket\n' > hello.txt
          # A one-page PDF whose text layer reads "hello from a pdf", with the
          # xref offsets computed so pdf-parse does not need to repair it.
          # Padded past 4 KB: Node hands smaller buffers out of a shared pool,
          # and upstream's pdf-parse then reads the wrong bytes ("bad XRef
          # entry") on every Node version. That is an upstream bug, not
          # something this test can catch a regression in.
          python3 - <<'PY'
          objs = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 300 100] "
              b"/Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>",
              None,
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          ]
          text = b"BT /F1 18 Tf 20 40 Td (hello from a pdf) Tj ET"
          objs[3] = b"<< /Length %d >>\nstream\n" % len(text) + text + b"\nendstream"
          out, offsets = bytearray(b"%PDF-1.4\n%" + b"x" * 5000 + b"\n"), []
          for n, body in enumerate(objs, 1):
              offsets.append(len(out))
              out += b"%d 0 obj\n" % n + body + b"\nendobj\n"
          xref = len(out)
          out += b"xref\n0 %d\n0000000000 65535 f \n" % (len(objs) + 1)
          out += b"".join(b"%010d 00000 n \n" % o for o in offsets)
          out += b"trailer\n<< /Size %d /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (len(objs) + 1, xref)
          open("hello.pdf", "wb").write(out)
          PY

          # Plain uploads: the gateway would otherwise keep aws-cli's chunked
          # checksum framing in the object, which corrupts the PDF.
          docker run --rm --network ci-net -v "$PWD:/w" -w /w \
            -e AWS_ACCESS_KEY_ID=ciaccesskey \
            -e AWS_SECRET_ACCESS_KEY=cisecretkey \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e AWS_REQUEST_CHECKSUM_CALCULATION=when_required \
            --entrypoint sh amazon/aws-cli:2.37.2 -c '
              aws --endpoint-url http://s3gw:9000 s3 mb s3://ci-bucket &&
              aws --endpoint-url http://s3gw:9000 s3 cp hello.txt s3://ci-bucket/hello.txt &&
              aws --endpoint-url http://s3gw:9000 s3 cp hello.pdf s3://ci-bucket/hello.pdf'

      - name: Start mcp
        run: |
          set -eu
          docker run -d --name mcp --network ci-net \
            -e AWS_ACCESS_KEY_ID=ciaccesskey \
            -e AWS_SECRET_ACCESS_KEY=cisecretkey \
            -e AWS_REGION=us-east-1 \
            -e AWS_ENDPOINT=http://s3gw:9000 \
            -e AWS_S3_FORCE_PATH_STYLE=true \
            -e S3_BUCKETS=ci-bucket \
            -e PORT=3000 \
            -p 3000:3000 mcp:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3000/health | grep -q '"ok"'

      - name: Assertions
        run: |
          set -eu
          # A response is either plain JSON or SSE; keep only the JSON of the
          # data lines in the SSE case. Each body is echoed so a failed grep
          # shows what the server actually said.
          call() {
            body=$(curl -sS -D headers.txt -X POST http://localhost:3000/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              ${SESSION:+-H "mcp-session-id: $SESSION"} \
              -d "$1")
            if printf '%s\n' "$body" | grep -q '^data: '; then
              body=$(printf '%s\n' "$body" | sed -n 's/^data: //p')
            fi
            printf '%s\n' "$body" | tee -a responses.log
          }

          echo "initialize succeeds and opens a session"
          call '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -q '"serverInfo"'
          SESSION=$(tr -d '\r' < headers.txt | awk -F': ' 'tolower($1)=="mcp-session-id"{print $2}')
          [ -n "$SESSION" ]
          curl -sS -o /dev/null -X POST http://localhost:3000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H "mcp-session-id: $SESSION" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}'

          echo "the three tools are listed"
          tools=$(call '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          for t in list-buckets list-objects get-object; do echo "$tools" | grep -q "\"$t\""; done

          echo "list-objects sees both objects through the S3 client"
          objects=$(call '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list-objects","arguments":{"bucket":"ci-bucket"}}}')
          echo "$objects" | grep -q 'hello.txt'
          echo "$objects" | grep -q 'hello.pdf'

          echo "get-object returns a text object"
          call '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"get-object","arguments":{"bucket":"ci-bucket","key":"hello.txt"}}}' \
            | grep -q 'hello from the bucket'

          echo "get-object extracts the text of a PDF"
          call '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"get-object","arguments":{"bucket":"ci-bucket","key":"hello.pdf"}}}' \
            | grep -q 'hello from a pdf'

      - name: mcp logs on failure
        if: failure()
        run: |
          cat headers.txt responses.log || true
          docker logs mcp || true
          docker logs s3gw || true

  # The gateway's nginx config is rendered at container start, not at build
  # time, so a broken template passes the image build and only fails once it
  # reaches Railway. This job starts the real image and asserts the routing
  # and auth behaviour the gateway is responsible for.
  gateway-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build gateway image locally
        uses: docker/build-push-action@v7
        with:
          context: gateway
          push: false
          load: true
          tags: gateway:ci
          cache-from: type=gha,scope=gateway

      - name: Start stub upstream
        run: |
          docker network create ci-net
          mkdir -p stub
          # The real upstream answers on /mcp, so the stub must too. Serving
          # only / would make every proxied request 404 and the assertions
          # below would be testing nothing.
          printf 'upstream root\n' > stub/index.html
          printf 'upstream mcp\n' > stub/mcp
          docker run -d --name mcp --network ci-net \
            -v "$PWD/stub:/usr/share/nginx/html:ro" \
            nginx:1.29.8-alpine

      - name: Start gateway with the keyed path enabled
        run: |
          docker run -d --name gw --network ci-net \
            -e API_KEYS=goodkeyone,goodkeytwo \
            -e PATH_KEY_AUTH=true \
            -e MCP_HOST=mcp \
            -e MCP_PORT=80 \
            -e PORT=8080 \
            -p 8080:8080 gateway:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz >/dev/null

      - name: nginx config is valid
        run: docker exec gw nginx -t

      - name: Assertions
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          echo "both health spellings are open"
          [ "$(code http://localhost:8080/health)" = 200 ]
          [ "$(code http://localhost:8080/healthz)" = 200 ]

          echo "bare /mcp with no credential is rejected"
          [ "$(code http://localhost:8080/mcp)" = 401 ]

          echo "bare /mcp with a bad bearer is rejected"
          [ "$(code -H 'Authorization: Bearer nope' http://localhost:8080/mcp)" = 401 ]

          echo "bare /mcp with a good bearer reaches the upstream"
          [ "$(code -H 'Authorization: Bearer goodkeyone' http://localhost:8080/mcp)" = 200 ]
          curl -s -H 'Authorization: Bearer goodkeyone' http://localhost:8080/mcp | grep -q 'upstream mcp'

          echo "keyed path with no key at all is rejected"
          [ "$(code http://localhost:8080/k//mcp)" = 401 ]

          echo "keyed path with a bad key is rejected"
          [ "$(code http://localhost:8080/k/nope/mcp)" = 401 ]

          echo "keyed path with a good key reaches the upstream"
          [ "$(code http://localhost:8080/k/goodkeytwo/mcp)" = 200 ]

          echo "keyed path lands on /mcp upstream, not on the key segment"
          curl -s http://localhost:8080/k/goodkeytwo/mcp | grep -q 'upstream mcp'

          echo "a valid key does not unlock any other path"
          [ "$(code http://localhost:8080/k/goodkeyone/tools)" = 401 ]
          [ "$(code http://localhost:8080/k/goodkeyone/)" = 401 ]

      - name: Keyed path is off by default
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          docker run -d --name gw-default --network ci-net \
            -e API_KEYS=goodkeyone \
            -e MCP_HOST=mcp \
            -e MCP_PORT=80 \
            -e PORT=8080 \
            -p 8081:8080 gateway:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          echo "the empty include still yields a valid config"
          docker exec gw-default nginx -t

          echo "a good key in the path is rejected when PATH_KEY_AUTH is unset"
          [ "$(code http://localhost:8081/k/goodkeyone/mcp)" = 401 ]

          echo "the header form is unaffected"
          [ "$(code -H 'Authorization: Bearer goodkeyone' http://localhost:8081/mcp)" = 200 ]

      - name: Invalid API_KEYS characters are refused at startup
        run: |
          set -eu
          # The keys are interpolated into an nginx map regex, so the entrypoint
          # rejects anything outside its charset rather than render a broken
          # config that would let every request through.
          ! docker run --rm --network ci-net \
            -e 'API_KEYS=bad|key' \
            -e MCP_HOST=mcp -e MCP_PORT=80 -e PORT=8080 \
            gateway:ci

      - name: Regex metacharacters in keys match literally
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          # "." and "+" are allowed in keys and are PCRE metacharacters. The
          # entrypoint escapes them, so "abc.def" must not also admit "abcXdef"
          # and "a+b" must not admit "aab".
          docker run -d --name gw-meta --network ci-net \
            -e 'API_KEYS=abc.def,a+b' \
            -e MCP_HOST=mcp -e MCP_PORT=80 -e PORT=8080 \
            -p 8082:8080 gateway:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8082/health >/dev/null 2>&1 && break
            sleep 1
          done

          echo "the exact keys are accepted"
          [ "$(code -H 'Authorization: Bearer abc.def' http://localhost:8082/mcp)" = 200 ]
          [ "$(code -H 'Authorization: Bearer a+b' http://localhost:8082/mcp)" = 200 ]

          echo "a wildcard or repetition match is rejected"
          [ "$(code -H 'Authorization: Bearer abcXdef' http://localhost:8082/mcp)" = 401 ]
          [ "$(code -H 'Authorization: Bearer aab' http://localhost:8082/mcp)" = 401 ]

      - name: Gateway logs on failure
        if: failure()
        run: |
          docker logs gw || true
          docker logs gw-default || true
          docker logs gw-meta || true
